services:
  auth-site:
    build:
      context: .
      dockerfile: src/AuthSite/Dockerfile
    container_name: demo-auth-site
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SecretKey: ${JWT_SECRET_KEY}

  app-one:
    build:
      context: .
      dockerfile: src/AppOne/Dockerfile
    container_name: demo-app-one
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__SecretKey: ${JWT_SECRET_KEY}

  hub:
    build:
      context: .
      dockerfile: src/Hub/Dockerfile
    container_name: demo-hub
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AppOne__BaseUrl: http://app-one:8080
    depends_on:
      - app-one
